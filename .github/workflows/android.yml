name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js static export
        run: npx next build

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Check Android SDK setup
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls -la $ANDROID_HOME/ || true
          ls -la $ANDROID_HOME/cmdline-tools/ 2>/dev/null || echo "No cmdline-tools at expected path"
          ls -la $ANDROID_HOME/platforms/ 2>/dev/null || echo "No platforms dir"
          find $ANDROID_HOME -name "sdkmanager" 2>/dev/null || echo "sdkmanager not found"

      - name: Accept licenses & install platform 36
        run: |
          SDKMANAGER=$(find $ANDROID_HOME -name "sdkmanager" -type f 2>/dev/null | head -1)
          if [ -z "$SDKMANAGER" ]; then
            echo "SDK manager not found, trying sdkmanager in PATH"
            yes | sdkmanager "platforms;android-36" --sdk_root=$ANDROID_HOME || true
          else
            echo "Found sdkmanager at: $SDKMANAGER"
            yes | $SDKMANAGER "platforms;android-36" --sdk_root=$ANDROID_HOME
            yes | $SDKMANAGER --licenses --sdk_root=$ANDROID_HOME
          fi

      - name: Copy web assets to Capacitor
        run: |
          rm -rf android/app/src/main/assets/public
          mkdir -p android/app/src/main/assets/public
          cp -r out/* android/app/src/main/assets/public/

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Build APK
        run: cd android && ./gradlew assembleDebug --no-daemon --stacktrace
        env:
          JAVA_OPTS: -Xmx4g
          GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx4g"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lifeos-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/debug/app-debug.apk
          generate_release_notes: true
